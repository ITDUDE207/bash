<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bash Sandbox</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Consolas, "Courier New", monospace;
}

body {
    color: #eee;
}

#terminal {
    width: 100%;
    height: 100%;
    padding: 18px;
    overflow-y: auto;
    background: #000;
    cursor: text;
    font-size: 15px;
    line-height: 1.5;
}

.line {
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
    padding: 0;
}

.info {
    color: #aaa;
}

.error {
    color: #ff5555;
}

.success {
    color: #00ff66;
}

#inputLine {
    display: flex;
    align-items: baseline;
    margin: 0;
    padding: 0;
}

#prompt {
    color: #00ff66;
    white-space: nowrap;
}

#commandInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font: inherit;
    padding: 0;
    margin: 0;
    min-width: 0;
}

#commandInput::selection {
    background: #444;
}
</style>
</head>

<body>

<div id="terminal"><div class="line info">Bash Sandbox</div><div class="line info">Powered by Bashkit WebAssembly</div><div class="line info">Type "help" to get started.</div><br><div id="output"></div><div id="inputLine"><span id="prompt">user@sandbox:~$</span><span>&nbsp;</span><input id="commandInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus></div></div>

<script type="module">

import {
    initBashkit,
    Bash
} from "https://esm.sh/@everruns/bashkit-wasm";


/*
 * TERMINAL ELEMENTS
 */

const terminal =
    document.getElementById("terminal");

const output =
    document.getElementById("output");

const input =
    document.getElementById("commandInput");

const prompt =
    document.getElementById("prompt");


/*
 * BASHKIT INSTANCE
 */

let bash = null;


/*
 * COMMAND HISTORY
 */

let commandHistory = [];

let historyIndex = -1;


/*
 * INITIALIZE BASHKIT
 */

async function start() {

    try {

        await initBashkit();

        bash = new Bash();

        /*
         * Create the user's home directory.
         */

        bash.executeSync(`
            export USER=user
            export HOME=/home/user
            export SHELL=/bin/bash
            export PATH=/usr/local/bin:/usr/bin:/bin
            mkdir -p /home/user
            cd /home/user
        `);

        print(
            "Bashkit WASM initialized.",
            "success"
        );

        print(
            "Sandbox ready.",
            "info"
        );

        input.focus();

    } catch (error) {

        print(
            "Failed to initialize Bashkit.",
            "error"
        );

        print(
            error.message,
            "error"
        );
    }
}


/*
 * EXECUTE COMMAND
 */

function executeCommand(command) {

    if (!bash) {

        print(
            "Bashkit is still loading...",
            "error"
        );

        return;
    }


    /*
     * Display command.
     */

    printCommand(command);


    /*
     * Empty command.
     */

    if (!command.trim()) {

        return;
    }


    /*
     * Add to history.
     */

    commandHistory.push(command);

    historyIndex = -1;


    /*
     * Special browser-side clear command.
     */

    if (command.trim() === "clear") {

        output.innerHTML = "";

        return;
    }


    try {

        /*
         * Execute inside Bashkit.
         */

        const result =
            bash.executeSync(command);


        /*
         * STDOUT
         */

        if (result.stdout) {

            print(
                result.stdout
            );
        }


        /*
         * STDERR
         */

        if (result.stderr) {

            print(
                result.stderr,
                "error"
            );
        }


        /*
         * Exit code
         */

        if (
            typeof result.exitCode === "number" &&
            result.exitCode !== 0
        ) {

            print(
                "[exit code " +
                result.exitCode +
                "]",
                "error"
            );
        }


        /*
         * Update prompt.
         */

        updatePrompt();

    } catch (error) {

        print(
            "Execution error: " +
            error.message,
            "error"
        );
    }


    scrollTerminal();
}


/*
 * DISPLAY COMMAND
 */

function printCommand(command) {

    const line =
        document.createElement("div");

    line.className =
        "line";

    const promptText =
        document.createElement("span");

    promptText.className =
        "prompt";

    promptText.textContent =
        prompt.textContent + " ";


    const commandText =
        document.createElement("span");

    commandText.textContent =
        command;


    line.appendChild(promptText);
    line.appendChild(commandText);

    output.appendChild(line);
}


/*
 * DISPLAY OUTPUT
 */

function print(
    text,
    type = ""
) {

    const line =
        document.createElement("div");

    line.className =
        "line " + type;

    line.textContent =
        text;

    output.appendChild(line);

    scrollTerminal();
}


/*
 * UPDATE PROMPT
 */

function updatePrompt() {

    try {

        const result =
            bash.executeSync("pwd");

        const cwd =
            result.stdout.trim();


        let displayPath;


        if (cwd === "/home/user") {

            displayPath = "~";

        } else if (
            cwd.startsWith("/home/user/")
        ) {

            displayPath =
                "~" +
                cwd.substring(
                    "/home/user".length
                );

        } else {

            displayPath = cwd;
        }


        prompt.textContent =
            "user@sandbox:" +
            displayPath +
            "$";

    } catch {

        prompt.textContent =
            "user@sandbox:~$";
    }
}


/*
 * KEYBOARD INPUT
 */

input.addEventListener(
    "keydown",
    function(event) {


        /*
         * ENTER
         */

        if (event.key === "Enter") {

            const command =
                input.value;

            input.value = "";

            executeCommand(command);

            return;
        }


        /*
         * ARROW UP
         */

        if (event.key === "ArrowUp") {

            if (
                commandHistory.length === 0
            ) {
                return;
            }


            if (
                historyIndex <
                commandHistory.length - 1
            ) {

                historyIndex++;
            }


            input.value =
                commandHistory[
                    commandHistory.length -
                    1 -
                    historyIndex
                ];

            event.preventDefault();

            return;
        }


        /*
         * ARROW DOWN
         */

        if (event.key === "ArrowDown") {

            if (historyIndex > 0) {

                historyIndex--;

                input.value =
                    commandHistory[
                        commandHistory.length -
                        1 -
                        historyIndex
                    ];

            } else {

                historyIndex = -1;

                input.value = "";
            }

            event.preventDefault();

            return;
        }


        /*
         * CTRL + L
         */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "l"
        ) {

            output.innerHTML = "";

            event.preventDefault();

            return;
        }
    }
);


/*
 * KEEP INPUT FOCUSED
 */

terminal.addEventListener(
    "click",
    function() {

        input.focus();

    }
);


/*
 * START BASHKIT
 */

start();

</script>

</body>
</html>
