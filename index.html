
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browser Linux Sandbox</title>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.4.0/css/xterm.css"
>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#terminal {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="terminal"></div>

<script type="module">

import {
    Terminal
} from "https://esm.sh/@xterm/xterm@5.4.0";

import {
    FitAddon
} from "https://esm.sh/@xterm/addon-fit@0.9.0";

import {
    initBashkit,
    Bash
} from "https://esm.sh/@everruns/bashkit-wasm";


/* =========================================================
   XTERM
========================================================= */

const terminalElement =
    document.getElementById("terminal");

const term =
    new Terminal({
        cursorBlink: true,
        cursorStyle: "block",
        fontFamily:
            'Consolas, "Courier New", monospace',
        fontSize: 15,
        lineHeight: 1.2,
        scrollback: 10000,
        convertEol: true,

        theme: {
            background: "#000000",
            foreground: "#f0f0f0",
            cursor: "#ffffff",

            black: "#000000",
            red: "#ff5555",
            green: "#50fa7b",
            yellow: "#f1fa8c",
            blue: "#6272a4",
            magenta: "#ff79c6",
            cyan: "#8be9fd",
            white: "#bbbbbb",

            brightBlack: "#555555",
            brightRed: "#ff6e6e",
            brightGreen: "#69ff94",
            brightYellow: "#ffffa5",
            brightBlue: "#7d8cff",
            brightMagenta: "#ff92df",
            brightCyan: "#a4ffff",
            brightWhite: "#ffffff"
        }
    });

const fitAddon =
    new FitAddon();

term.loadAddon(fitAddon);

term.open(terminalElement);

fitAddon.fit();

window.addEventListener(
    "resize",
    () => fitAddon.fit()
);


/* =========================================================
   BASH
========================================================= */

let bash = null;

let ready = false;

let inputBuffer = "";

let history = [];

let historyIndex = -1;

let currentDirectory = "~";

let saveTimer = null;


/* =========================================================
   OPFS
=========================================================

   Browser storage layout:

   OPFS
   └── bashkit-sandbox
       ├── manifest.json
       └── files
           ├── home/
           │   └── user/
           │       └── ...
           └── ...
========================================================= */

const OPFS_ROOT =
    "bashkit-sandbox";

const MANIFEST_FILE =
    "manifest.json";

const FILES_DIRECTORY =
    "files";


/* =========================================================
   OPFS HELPERS
========================================================= */

async function getOPFSRoot() {

    if (
        !navigator.storage ||
        !navigator.storage.getDirectory
    ) {

        throw new Error(
            "This browser does not support the Origin Private File System (OPFS)."
        );
    }

    return await navigator.storage.getDirectory();
}


async function getSandboxDirectory(
    create = true
) {

    const root =
        await getOPFSRoot();

    return await root.getDirectoryHandle(
        OPFS_ROOT,
        {
            create
        }
    );
}


async function getFilesDirectory(
    create = true
) {

    const sandbox =
        await getSandboxDirectory(
            create
        );

    return await sandbox.getDirectoryHandle(
        FILES_DIRECTORY,
        {
            create
        }
    );
}


/* =========================================================
   BASE64
========================================================= */

function stringToBase64(
    value
) {

    const bytes =
        new TextEncoder().encode(
            value
        );

    let binary = "";

    const chunkSize = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );

        binary += String.fromCharCode(
            ...chunk
        );
    }

    return btoa(binary);
}


function base64ToString(
    value
) {

    const binary =
        atob(value);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);
    }

    return new TextDecoder().decode(
        bytes
    );
}


/* =========================================================
   PATH HELPERS
========================================================= */

function normalizeVFSPath(
    path
) {

    if (!path) {
        return "/";
    }

    path =
        path.replace(
            /\\/g,
            "/"
        );

    if (
        !path.startsWith("/")
    ) {

        path =
            "/" + path;
    }

    path =
        path.replace(
            /\/+/g,
            "/"
        );

    if (
        path.length > 1 &&
        path.endsWith("/")
    ) {

        path =
            path.slice(
                0,
                -1
            );
    }

    return path;
}


function pathParts(
    path
) {

    path =
        normalizeVFSPath(
            path
        );

    return path
        .split("/")
        .filter(
            part => part.length > 0
        );
}


/* =========================================================
   OPFS PATH ACCESS
========================================================= */

async function getOPFSDirectoryForPath(
    path,
    create = true
) {

    const parts =
        pathParts(path);

    const root =
        await getFilesDirectory(
            create
        );

    let directory =
        root;

    /*
     * All VFS paths are stored beneath
     * the OPFS "files" directory.
     */

    for (
        const part of parts
    ) {

        directory =
            await directory.getDirectoryHandle(
                part,
                {
                    create
                }
            );
    }

    return directory;
}


async function getOPFSParentDirectory(
    path,
    create = true
) {

    const normalized =
        normalizeVFSPath(
            path
        );

    const parts =
        pathParts(
            normalized
        );

    const filename =
        parts.pop();


    let directory =
        await getFilesDirectory(
            create
        );


    for (
        const part of parts
    ) {

        directory =
            await directory.getDirectoryHandle(
                part,
                {
                    create
                }
            );
    }


    return {
        directory,
        filename
    };
}


/* =========================================================
   SAVE ONE FILE TO OPFS
========================================================= */

async function saveFileToOPFS(
    path,
    content
) {

    const {
        directory,
        filename
    } =
        await getOPFSParentDirectory(
            path,
            true
        );


    const file =
        await directory.getFileHandle(
            filename,
            {
                create: true
            }
        );


    const writable =
        await file.createWritable();


    await writable.write(
        content
    );


    await writable.close();
}


/* =========================================================
   READ ONE FILE FROM OPFS
========================================================= */

async function readFileFromOPFS(
    path
) {

    const {
        directory,
        filename
    } =
        await getOPFSParentDirectory(
            path,
            false
        );


    const file =
        await directory.getFileHandle(
            filename
        );


    const data =
        await file.getFile();


    return await data.text();
}


/* =========================================================
   DELETE OPFS TREE
========================================================= */

async function deleteOPFSDirectory(
    directory
) {

    const entries = [];

    for await (
        const [name, handle]
        of directory.entries()
    ) {

        entries.push({
            name,
            handle
        });
    }


    for (
        const entry
        of entries
    ) {

        if (
            entry.handle.kind === "directory"
        ) {

            await deleteOPFSDirectory(
                entry.handle
            );

            await directory.removeEntry(
                entry.name,
                {
                    recursive: true
                }
            );

        } else {

            await directory.removeEntry(
                entry.name
            );
        }
    }
}


/* =========================================================
   GET ALL BASHKIT FILES
========================================================= */

function collectVFSFiles(
    path = "/",
    files = []
) {

    const entries =
        bash.readDir(
            path
        );


    for (
        const entry
        of entries
    ) {

        const childPath =
            path === "/"
                ? "/" + entry.name
                : path + "/" + entry.name;


        if (
            entry.metadata.fileType ===
            "directory"
        ) {

            collectVFSFiles(
                childPath,
                files
            );

        } else {

            files.push(
                childPath
            );
        }
    }


    return files;
}


/* =========================================================
   SAVE BASHKIT FILESYSTEM
========================================================= */

async function saveFilesystem() {

    if (!bash) {
        return false;
    }


    try {

        const files =
            collectVFSFiles(
                "/"
            );


        const manifest = {
            version: 1,
            savedAt:
                new Date().toISOString(),
            files: []
        };


        /*
         * Save every file from Bashkit's
         * virtual filesystem into OPFS.
         */

        for (
            const path
            of files
        ) {

            try {

                const content =
                    bash.readFile(
                        path
                    );


                await saveFileToOPFS(
                    path,
                    content
                );


                manifest.files.push({
                    path,
                    encoding: "utf-8"
                });

            } catch (error) {

                console.warn(
                    "Could not save:",
                    path,
                    error
                );
            }
        }


        /*
         * Save the manifest.
         */

        const sandbox =
            await getSandboxDirectory(
                true
            );


        const manifestHandle =
            await sandbox.getFileHandle(
                MANIFEST_FILE,
                {
                    create: true
                }
            );


        const writable =
            await manifestHandle.createWritable();


        await writable.write(
            JSON.stringify(
                manifest,
                null,
                2
            )
        );


        await writable.close();


        return true;

    } catch (error) {

        console.error(
            "OPFS save failed:",
            error
        );

        return false;
    }
}


/* =========================================================
   LOAD BASHKIT FILESYSTEM
========================================================= */

async function loadFilesystem() {

    try {

        const sandbox =
            await getSandboxDirectory(
                false
            );


        const manifestHandle =
            await sandbox.getFileHandle(
                MANIFEST_FILE
            );


        const manifestFile =
            await manifestHandle.getFile();


        const manifestText =
            await manifestFile.text();


        const manifest =
            JSON.parse(
                manifestText
            );


        if (
            !manifest.files ||
            !Array.isArray(
                manifest.files
            )
        ) {

            return false;
        }


        /*
         * Restore every saved file
         * into Bashkit's VFS.
         */

        for (
            const item
            of manifest.files
        ) {

            try {

                const content =
                    await readFileFromOPFS(
                        item.path
                    );


                bash.writeFile(
                    item.path,
                    content
                );

            } catch (error) {

                console.warn(
                    "Could not restore:",
                    item.path,
                    error
                );
            }
        }


        return true;

    } catch (error) {

        /*
         * FileNotFound means this is simply
         * the first visit.
         */

        if (
            error.name ===
            "NotFoundError"
        ) {

            return false;
        }


        console.error(
            "OPFS restore failed:",
            error
        );


        return false;
    }
}


/* =========================================================
   DELETE SAVED SANDBOX
========================================================= */

async function deleteSavedSandbox() {

    try {

        const root =
            await getOPFSRoot();


        await root.removeEntry(
            OPFS_ROOT,
            {
                recursive: true
            }
        );


        return true;

    } catch (error) {

        if (
            error.name ===
            "NotFoundError"
        ) {

            return true;
        }


        console.error(
            "OPFS delete failed:",
            error
        );


        return false;
    }
}


/* =========================================================
   AUTO SAVE
========================================================= */

function scheduleSave() {

    clearTimeout(
        saveTimer
    );


    saveTimer =
        setTimeout(
            async () => {

                await saveFilesystem();

            },
            300
        );
}


/* =========================================================
   PROMPT
========================================================= */

function updatePrompt() {

    if (!bash) {
        return;
    }


    try {

        const result =
            bash.executeSync(
                "pwd"
            );


        const cwd =
            result.stdout.trim();


        if (
            cwd === "/home/user"
        ) {

            currentDirectory =
                "~";

        } else if (
            cwd.startsWith(
                "/home/user/"
            )
        ) {

            currentDirectory =
                "~" +
                cwd.substring(
                    "/home/user".length
                );

        } else {

            currentDirectory =
                cwd;
        }

    } catch {

        currentDirectory =
            "~";
    }
}


function writePrompt() {

    term.write(
        "\x1b[32muser@sandbox\x1b[0m:" +
        "\x1b[36m" +
        currentDirectory +
        "\x1b[0m$ "
    );
}


/* =========================================================
   OUTPUT
========================================================= */

function writeOutput(
    text
) {

    if (!text) {
        return;
    }


    text =
        text.replace(
            /\r\n/g,
            "\n"
        );


    text =
        text.replace(
            /\r/g,
            "\n"
        );


    const lines =
        text.split("\n");


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        if (
            lines[i].length > 0
        ) {

            term.write(
                lines[i]
            );
        }


        if (
            i <
            lines.length - 1
        ) {

            term.write(
                "\r\n"
            );
        }
    }
}


function newLine() {

    term.write(
        "\r\n"
    );
}


/* =========================================================
   INITIALIZE
========================================================= */

async function start() {

    term.write(
        "\x1b[90mStarting Browser Linux Sandbox...\x1b[0m\r\n"
    );


    try {

        await initBashkit();


        bash =
            new Bash({
                username: "user",
                hostname: "sandbox",
                cwd: "/home/user",

                env: {
                    USER: "user",
                    HOME: "/home/user",
                    SHELL: "/bin/bash"
                }
            });


        /*
         * Create basic directories.
         */

        bash.executeSync(
            "mkdir -p /home/user"
        );


        bash.executeSync(
            "cd /home/user"
        );


        /*
         * Restore files from OPFS.
         */

        const restored =
            await loadFilesystem();


        if (restored) {

            term.write(
                "\x1b[32mSandbox files restored from browser storage.\x1b[0m\r\n"
            );

        } else {

            await saveFilesystem();


            term.write(
                "\x1b[32mNew sandbox created.\x1b[0m\r\n"
            );
        }


        updatePrompt();


        ready = true;


        term.write(
            "\x1b[90mFiles are automatically saved in this browser.\x1b[0m\r\n"
        );


        term.write(
            "\x1b[90mType \"help\" for commands.\x1b[0m\r\n\r\n"
        );


        writePrompt();


        term.focus();


    } catch (error) {

        term.write(
            "\r\n\x1b[31mBashkit initialization failed.\x1b[0m\r\n"
        );


        term.write(
            "\x1b[31m" +
            error.name +
            ": " +
            error.message +
            "\x1b[0m\r\n"
        );


        console.error(
            "Bashkit initialization error:",
            error
        );
    }
}


/* =========================================================
   SPECIAL COMMANDS
========================================================= */

async function specialCommand(
    command
) {

    const trimmed =
        command.trim();


    /* HELP */

    if (
        trimmed === "help"
    ) {

        newLine();

        term.writeln(
            "\x1b[36mBrowser Linux Sandbox\x1b[0m"
        );

        term.writeln(
            ""
        );

        term.writeln(
            "  help       Show this help"
        );

        term.writeln(
            "  save       Save files now"
        );

        term.writeln(
            "  reset      Delete saved files"
        );

        term.writeln(
            "  clear      Clear terminal"
        );

        term.writeln(
            ""
        );

        writePrompt();

        return true;
    }


    /* SAVE */

    if (
        trimmed === "save"
    ) {

        newLine();


        const saved =
            await saveFilesystem();


        if (saved) {

            term.writeln(
                "\x1b[32mFiles saved to browser storage.\x1b[0m"
            );

        } else {

            term.writeln(
                "\x1b[31mCould not save files.\x1b[0m"
            );
        }


        writePrompt();

        return true;
    }


    /* RESET */

    if (
        trimmed === "reset"
    ) {

        newLine();

        term.writeln(
            "\x1b[33mThis will delete the saved browser filesystem.\x1b[0m"
        );

        term.writeln(
            "\x1b[33mType \"reset yes\" to confirm.\x1b[0m"
        );

        writePrompt();

        return true;
    }


    /* RESET YES */

    if (
        trimmed === "reset yes"
    ) {

        newLine();


        const deleted =
            await deleteSavedSandbox();


        if (deleted) {

            term.writeln(
                "\x1b[32mSaved browser filesystem deleted.\x1b[0m"
            );

            term.writeln(
                "\x1b[90mReload the page to create a fresh sandbox.\x1b[0m"
            );

        } else {

            term.writeln(
                "\x1b[31mCould not delete saved filesystem.\x1b[0m"
            );
        }


        writePrompt();

        return true;
    }


    /* CLEAR */

    if (
        trimmed === "clear"
    ) {

        term.clear();

        term.write(
            "\x1b[2J\x1b[H"
        );

        writePrompt();

        return true;
    }


    return false;
}


/* =========================================================
   EXECUTE
========================================================= */

async function executeCommand(
    command
) {

    if (!bash) {
        return;
    }


    /*
     * Empty command.
     */

    if (
        command.trim() === ""
    ) {

        newLine();

        writePrompt();

        return;
    }


    /*
     * History.
     */

    history.push(
        command
    );


    if (
        history.length > 100
    ) {

        history.shift();
    }


    historyIndex = -1;


    /*
     * Built-in commands.
     */

    if (
        await specialCommand(
            command
        )
    ) {

        return;
    }


    try {

        const result =
            bash.executeSync(
                command
            );


        /*
         * Finish command line.
         */

        newLine();


        /*
         * STDOUT.
         */

        if (
            result.stdout
        ) {

            writeOutput(
                result.stdout
            );
        }


        /*
         * STDERR.
         */

        if (
            result.stderr
        ) {

            if (
                result.stdout &&
                !result.stdout.endsWith("\n")
            ) {

                newLine();
            }


            term.write(
                "\x1b[31m"
            );


            writeOutput(
                result.stderr
            );


            term.write(
                "\x1b[0m"
            );
        }


        /*
         * Keep prompt separated.
         */

        newLine();


        updatePrompt();


        /*
         * Save filesystem after
         * every successful command.
         */

        scheduleSave();


        writePrompt();


    } catch (error) {

        newLine();


        term.write(
            "\x1b[31m" +
            error.message +
            "\x1b[0m"
        );


        newLine();


        writePrompt();
    }
}


/* =========================================================
   KEYBOARD INPUT
========================================================= */

term.onData(
    async data => {

        if (!ready) {
            return;
        }


        /*
         * ENTER
         */

        if (
            data === "\r"
        ) {

            const command =
                inputBuffer;


            inputBuffer =
                "";


            historyIndex =
                -1;


            await executeCommand(
                command
            );


            return;
        }


        /*
         * BACKSPACE
         */

        if (
            data === "\x7f"
        ) {

            if (
                inputBuffer.length > 0
            ) {

                inputBuffer =
                    inputBuffer.slice(
                        0,
                        -1
                    );


                term.write(
                    "\b \b"
                );
            }


            return;
        }


        /*
         * CTRL+C
         */

        if (
            data === "\x03"
        ) {

            term.write(
                "^C"
            );


            newLine();


            inputBuffer =
                "";


            historyIndex =
                -1;


            writePrompt();


            return;
        }


        /*
         * CTRL+L
         */

        if (
            data === "\x0c"
        ) {

            term.clear();


            term.write(
                "\x1b[2J\x1b[H"
            );


            writePrompt();


            return;
        }


        /*
         * UP
         */

        if (
            data === "\x1b[A"
        ) {

            historyUp();

            return;
        }


        /*
         * DOWN
         */

        if (
            data === "\x1b[B"
        ) {

            historyDown();

            return;
        }


        /*
         * Ignore escape sequences.
         */

        if (
            data.startsWith("\x1b")
        ) {

            return;
        }


        /*
         * Printable characters.
         */

        for (
            const character
            of data
        ) {

            if (
                character.charCodeAt(0) < 32
            ) {

                continue;
            }


            inputBuffer +=
                character;


            term.write(
                character
            );
        }
    }
);


/* =========================================================
   HISTORY UP
========================================================= */

function historyUp() {

    if (
        history.length === 0
    ) {

        return;
    }


    if (
        historyIndex === -1
    ) {

        historyIndex =
            history.length - 1;

    } else if (
        historyIndex > 0
    ) {

        historyIndex--;
    }


    replaceInput(
        history[
            historyIndex
        ]
    );
}


/* =========================================================
   HISTORY DOWN
========================================================= */

function historyDown() {

    if (
        historyIndex === -1
    ) {

        return;
    }


    if (
        historyIndex <
        history.length - 1
    ) {

        historyIndex++;


        replaceInput(
            history[
                historyIndex
            ]
        );

    } else {

        historyIndex =
            -1;


        replaceInput(
            ""
        );
    }
}


/* =========================================================
   REPLACE INPUT
========================================================= */

function replaceInput(
    text
) {

    while (
        inputBuffer.length > 0
    ) {

        inputBuffer =
            inputBuffer.slice(
                0,
                -1
            );


        term.write(
            "\b \b"
        );
    }


    inputBuffer =
        text;


    term.write(
        text
    );
}


/* =========================================================
   START
========================================================= */

start();

</script>

</body>
</html>
