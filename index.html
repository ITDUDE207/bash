<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bashkit Browser Sandbox</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Consolas, "Courier New", monospace;
}

body {
    overflow: hidden;
}

#terminal {
    width: 100%;
    height: 100%;
    padding: 16px;
    overflow-y: auto;
    background: #000;
    cursor: text;
    font-size: 15px;
    line-height: 1.5;
}

.line {
    margin: 0;
    padding: 0;
    white-space: pre-wrap;
    word-break: break-word;
}

.info {
    color: #aaa;
}

.success {
    color: #00ff66;
}

.error {
    color: #ff5555;
}

.command {
    color: #fff;
}

#inputLine {
    display: flex;
    align-items: baseline;
    margin: 0;
    padding: 0;
}

#prompt {
    color: #00ff66;
    white-space: nowrap;
}

#commandInput {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font: inherit;
    padding: 0;
    margin: 0;
}

#commandInput::selection {
    background: #444;
}
</style>
</head>

<body>

<div id="terminal">

<div class="line info">Bash Sandbox</div>
<div class="line info">Powered by Bashkit WebAssembly</div>
<div class="line info">Loading...</div>

<br>

<div id="output"></div>

<div id="inputLine">
<span id="prompt">user@sandbox:~$</span>
<span>&nbsp;</span>
<input
    id="commandInput"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    disabled
>
</div>

</div>

<script type="module">

import {
    initBashkit,
    Bash
} from "https://esm.sh/@everruns/bashkit-wasm";


const terminal =
    document.getElementById("terminal");

const output =
    document.getElementById("output");

const input =
    document.getElementById("commandInput");

const prompt =
    document.getElementById("prompt");


let bash = null;

let history = [];

let historyIndex = -1;


/*
 * PRINT
 */

function print(text, className = "") {

    const line =
        document.createElement("div");

    line.className =
        "line " + className;

    line.textContent =
        text;

    output.appendChild(line);

    terminal.scrollTop =
        terminal.scrollHeight;
}


/*
 * INITIALIZE
 */

async function start() {

    try {

        print(
            "Loading Bashkit WebAssembly..."
        );


        /*
         * Load the WASM module.
         */

        await initBashkit();


        print(
            "WASM module loaded.",
            "success"
        );


        /*
         * Create Bash instance.
         */

        bash = new Bash();


        print(
            "Bash interpreter created.",
            "success"
        );


        /*
         * Configure the shell.
         */

        bash.executeSync(
            'export USER="user"'
        );

        bash.executeSync(
            'export HOME="/home/user"'
        );

        bash.executeSync(
            'export SHELL="/bin/bash"'
        );

        bash.executeSync(
            'mkdir -p /home/user'
        );

        bash.executeSync(
            'cd /home/user'
        );


        /*
         * Ready.
         */

        print(
            "Bashkit WASM initialized.",
            "success"
        );

        print(
            "Sandbox ready.",
            "success"
        );

        input.disabled = false;

        input.focus();

        updatePrompt();


    } catch (error) {

        print(
            "FAILED TO INITIALIZE BASHKIT",
            "error"
        );

        print(
            "Error type: " +
            error.name,
            "error"
        );

        print(
            "Error message: " +
            error.message,
            "error"
        );


        /*
         * Some WASM errors don't have
         * a useful message, so display
         * the complete object too.
         */

        try {

            print(
                "Full error: " +
                JSON.stringify(
                    error,
                    Object.getOwnPropertyNames(error)
                ),
                "error"
            );

        } catch {

            print(
                "Could not serialize error.",
                "error"
            );
        }
    }
}


/*
 * UPDATE PROMPT
 */

function updatePrompt() {

    if (!bash) {
        return;
    }

    try {

        const result =
            bash.executeSync("pwd");

        const cwd =
            result.stdout.trim();

        let displayPath;

        if (
            cwd === "/home/user"
        ) {

            displayPath = "~";

        } else if (
            cwd.startsWith("/home/user/")
        ) {

            displayPath =
                "~" +
                cwd.substring(
                    "/home/user".length
                );

        } else {

            displayPath = cwd;
        }

        prompt.textContent =
            "user@sandbox:" +
            displayPath +
            "$";

    } catch {

        prompt.textContent =
            "user@sandbox:~$";
    }
}


/*
 * PRINT COMMAND
 */

function printCommand(command) {

    const line =
        document.createElement("div");

    line.className =
        "line";

    const promptElement =
        document.createElement("span");

    promptElement.className =
        "success";

    promptElement.textContent =
        prompt.textContent + " ";


    const commandElement =
        document.createElement("span");

    commandElement.className =
        "command";

    commandElement.textContent =
        command;


    line.appendChild(promptElement);
    line.appendChild(commandElement);

    output.appendChild(line);
}


/*
 * EXECUTE COMMAND
 */

function runCommand(command) {

    if (!bash) {

        print(
            "Bashkit is not initialized.",
            "error"
        );

        return;
    }


    printCommand(command);


    if (
        command.trim() === ""
    ) {

        return;
    }


    /*
     * Browser-side clear.
     */

    if (
        command.trim() === "clear"
    ) {

        output.innerHTML = "";

        return;
    }


    history.push(command);

    historyIndex = -1;


    try {

        const result =
            bash.executeSync(command);


        if (
            result.stdout
        ) {

            print(
                result.stdout
            );
        }


        if (
            result.stderr
        ) {

            print(
                result.stderr,
                "error"
            );
        }


        if (
            typeof result.exitCode === "number" &&
            result.exitCode !== 0
        ) {

            print(
                "[exit code " +
                result.exitCode +
                "]",
                "error"
            );
        }


        updatePrompt();


    } catch (error) {

        print(
            "Command error: " +
            error.message,
            "error"
        );
    }


    terminal.scrollTop =
        terminal.scrollHeight;
}


/*
 * KEYBOARD
 */

input.addEventListener(
    "keydown",
    function(event) {


        /*
         * ENTER
         */

        if (
            event.key === "Enter"
        ) {

            const command =
                input.value;

            input.value = "";

            runCommand(command);

            return;
        }


        /*
         * UP
         */

        if (
            event.key === "ArrowUp"
        ) {

            if (
                history.length === 0
            ) {
                return;
            }


            if (
                historyIndex <
                history.length - 1
            ) {

                historyIndex++;
            }


            input.value =
                history[
                    history.length -
                    1 -
                    historyIndex
                ];

            event.preventDefault();

            return;
        }


        /*
         * DOWN
         */

        if (
            event.key === "ArrowDown"
        ) {

            if (
                historyIndex > 0
            ) {

                historyIndex--;

                input.value =
                    history[
                        history.length -
                        1 -
                        historyIndex
                    ];

            } else {

                historyIndex = -1;

                input.value = "";
            }


            event.preventDefault();

            return;
        }


        /*
         * CTRL + L
         */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "l"
        ) {

            output.innerHTML = "";

            event.preventDefault();
        }

    }
);


/*
 * FOCUS TERMINAL
 */

terminal.addEventListener(
    "click",
    function() {

        if (!input.disabled) {
            input.focus();
        }

    }
);


/*
 * START
 */

start();

</script>

</body>
</html>
