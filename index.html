
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browser Linux Sandbox</title>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.4.0/css/xterm.css"
>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#terminal {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="terminal"></div>

<script type="module">

import {
    Terminal
} from "https://esm.sh/@xterm/xterm@5.4.0";

import {
    FitAddon
} from "https://esm.sh/@xterm/addon-fit@0.9.0";

import {
    initBashkit,
    Bash
} from "https://esm.sh/@everruns/bashkit-wasm@0.18.0";


/* =========================================================
   XTERM
========================================================= */

const terminal =
    new Terminal({
        cursorBlink: true,
        cursorStyle: "block",
        fontFamily:
            'Consolas, "Courier New", monospace',
        fontSize: 15,
        lineHeight: 1.2,
        scrollback: 10000,
        convertEol: true,

        theme: {
            background: "#000000",
            foreground: "#f0f0f0",
            cursor: "#ffffff",

            black: "#000000",
            red: "#ff5555",
            green: "#50fa7b",
            yellow: "#f1fa8c",
            blue: "#6272a4",
            magenta: "#ff79c6",
            cyan: "#8be9fd",
            white: "#bbbbbb",

            brightBlack: "#555555",
            brightRed: "#ff6e6e",
            brightGreen: "#69ff94",
            brightYellow: "#ffffa5",
            brightBlue: "#7d8cff",
            brightMagenta: "#ff92df",
            brightCyan: "#a4ffff",
            brightWhite: "#ffffff"
        }
    });


const fit =
    new FitAddon();

terminal.loadAddon(fit);

terminal.open(
    document.getElementById("terminal")
);

fit.fit();

window.addEventListener(
    "resize",
    () => fit.fit()
);


/* =========================================================
   STATE
========================================================= */

let bash = null;

let ready = false;

let inputBuffer = "";

let history = [];

let historyIndex = -1;

let currentDirectory = "~";

let commandRunning = false;


/* =========================================================
   OPFS
========================================================= */

const OPFS_DIRECTORY =
    "bashkit-linux-sandbox";


async function getOPFSRoot() {

    if (
        !navigator.storage ||
        !navigator.storage.getDirectory
    ) {

        throw new Error(
            "This browser does not support OPFS."
        );
    }

    return await navigator.storage.getDirectory();
}


async function getSandboxRoot(
    create = true
) {

    const root =
        await getOPFSRoot();

    return await root.getDirectoryHandle(
        OPFS_DIRECTORY,
        {
            create
        }
    );
}


/* =========================================================
   PATH HELPERS
========================================================= */

function normalizePath(path) {

    if (!path) {
        return "/";
    }

    path =
        String(path)
            .replace(/\\/g, "/");

    if (
        !path.startsWith("/")
    ) {

        path =
            "/" + path;
    }

    const parts = [];

    for (
        const part
        of path.split("/")
    ) {

        if (
            !part ||
            part === "."
        ) {

            continue;
        }

        if (
            part === ".."
        ) {

            parts.pop();

        } else {

            parts.push(
                part
            );
        }
    }

    return "/" +
        parts.join("/");
}


function parts(path) {

    const normalized =
        normalizePath(path);

    if (
        normalized === "/"
    ) {

        return [];
    }

    return normalized
        .slice(1)
        .split("/");
}


/* =========================================================
   OPFS DIRECTORY LOOKUP
========================================================= */

async function getDirectory(
    path,
    create = false
) {

    const root =
        await getSandboxRoot(
            create
        );

    let directory =
        root;

    for (
        const part
        of parts(path)
    ) {

        directory =
            await directory.getDirectoryHandle(
                part,
                {
                    create
                }
            );
    }

    return directory;
}


async function getParent(
    path,
    create = false
) {

    const normalized =
        normalizePath(path);

    const pathParts =
        parts(normalized);

    const name =
        pathParts.pop();


    let directory =
        await getSandboxRoot(
            create
        );


    for (
        const part
        of pathParts
    ) {

        directory =
            await directory.getDirectoryHandle(
                part,
                {
                    create
                }
            );
    }


    return {
        directory,
        name
    };
}


/* =========================================================
   ERROR HELPERS
========================================================= */

function fsError(
    code,
    message
) {

    const error =
        new Error(
            message
        );

    error.code =
        code;

    return error;
}


/* =========================================================
   HOST FILESYSTEM
========================================================= */

const persistentFS = {


    /* -----------------------------------------
       READ
    ----------------------------------------- */

    async read(path) {

        const normalized =
            normalizePath(path);


        /*
         * /dev/null
         */

        if (
            normalized === "/dev/null"
        ) {

            return new Uint8Array();
        }


        try {

            const {
                directory,
                name
            } =
                await getParent(
                    normalized,
                    false
                );


            const handle =
                await directory.getFileHandle(
                    name
                );


            const file =
                await handle.getFile();


            return new Uint8Array(
                await file.arrayBuffer()
            );


        } catch (error) {

            if (
                error.name ===
                "NotFoundError"
            ) {

                throw fsError(
                    "ENOENT",
                    `No such file or directory: ${normalized}`
                );
            }


            throw error;
        }
    },


    /* -----------------------------------------
       WRITE
    ----------------------------------------- */

    async write(
        path,
        bytes
    ) {

        const normalized =
            normalizePath(path);


        /*
         * /dev/null discards writes.
         */

        if (
            normalized === "/dev/null"
        ) {

            return;
        }


        const {
            directory,
            name
        } =
            await getParent(
                normalized,
                true
            );


        const handle =
            await directory.getFileHandle(
                name,
                {
                    create: true
                }
            );


        const writable =
            await handle.createWritable();


        await writable.write(
            bytes
        );


        await writable.close();
    },


    /* -----------------------------------------
       MKDIR
    ----------------------------------------- */

    async mkdir(
        path,
        recursive = false
    ) {

        const normalized =
            normalizePath(path);


        if (
            normalized === "/"
        ) {

            return;
        }


        try {

            await getDirectory(
                normalized,
                recursive
            );

        } catch (error) {

            if (
                error.name ===
                "NotFoundError"
            ) {

                throw fsError(
                    "ENOENT",
                    `No such file or directory: ${normalized}`
                );
            }


            if (
                error.name ===
                "TypeMismatchError"
            ) {

                throw fsError(
                    "EEXIST",
                    `File exists: ${normalized}`
                );
            }


            throw error;
        }
    },


    /* -----------------------------------------
       REMOVE
    ----------------------------------------- */

    async remove(
        path,
        recursive = false
    ) {

        const normalized =
            normalizePath(path);


        if (
            normalized === "/"
        ) {

            throw fsError(
                "EPERM",
                "Cannot remove filesystem root"
            );
        }


        const {
            directory,
            name
        } =
            await getParent(
                normalized,
                false
            );


        try {

            await directory.removeEntry(
                name,
                {
                    recursive
                }
            );

        } catch (error) {

            if (
                error.name ===
                "NotFoundError"
            ) {

                throw fsError(
                    "ENOENT",
                    `No such file or directory: ${normalized}`
                );
            }


            if (
                error.name ===
                "InvalidModificationError"
            ) {

                throw fsError(
                    "ENOTEMPTY",
                    `Directory not empty: ${normalized}`
                );
            }


            throw error;
        }
    },


    /* -----------------------------------------
       STAT
    ----------------------------------------- */

    async stat(path) {

        const normalized =
            normalizePath(path);


        if (
            normalized === "/"
        ) {

            return {
                type: "dir"
            };
        }


        /*
         * /dev/null
         */

        if (
            normalized === "/dev/null"
        ) {

            return {
                type: "file",
                size: 0
            };
        }


        const {
            directory,
            name
        } =
            await getParent(
                normalized,
                false
            );


        try {

            const file =
                await directory.getFileHandle(
                    name
                );


            const data =
                await file.getFile();


            return {
                type: "file",
                size: data.size,
                mtimeMs: data.lastModified
            };


        } catch (fileError) {

            try {

                await directory.getDirectoryHandle(
                    name
                );


                return {
                    type: "dir"
                };


            } catch {

                throw fsError(
                    "ENOENT",
                    `No such file or directory: ${normalized}`
                );
            }
        }
    },


    /* -----------------------------------------
       READ DIRECTORY
    ----------------------------------------- */

    async readDir(path) {

        const normalized =
            normalizePath(path);


        const directory =
            await getDirectory(
                normalized,
                false
            );


        const result = [];


        for await (
            const [
                name,
                handle
            ]
            of directory.entries()
        ) {

            if (
                handle.kind ===
                "directory"
            ) {

                result.push({
                    name,
                    type: "dir"
                });

            } else {

                try {

                    const file =
                        await handle.getFile();


                    result.push({
                        name,
                        type: "file",
                        size: file.size,
                        mtimeMs:
                            file.lastModified
                    });

                } catch {

                    result.push({
                        name,
                        type: "file"
                    });
                }
            }
        }


        return result;
    },


    /* -----------------------------------------
       EXISTS
    ----------------------------------------- */

    async exists(path) {

        const normalized =
            normalizePath(path);


        if (
            normalized === "/dev/null"
        ) {

            return true;
        }


        try {

            await this.stat(
                normalized
            );

            return true;

        } catch {

            return false;
        }
    }
};


/* =========================================================
   INITIALIZE STORAGE
========================================================= */

async function initializeStorage() {

    /*
     * Create the persistent sandbox.
     */

    await getSandboxRoot(
        true
    );


    /*
     * Create the standard Linux
     * directories we need.
     */

    await persistentFS.mkdir(
        "/home",
        true
    );

    await persistentFS.mkdir(
        "/home/user",
        true
    );

    await persistentFS.mkdir(
        "/tmp",
        true
    );

    await persistentFS.mkdir(
        "/dev",
        true
    );
}


/* =========================================================
   PROMPT
========================================================= */

async function updatePrompt() {

    if (!bash) {
        return;
    }


    try {

        /*
         * pwd itself uses the persistent
         * filesystem and current Bash state.
         */

        const result =
            await bash.execute(
                "pwd"
            );


        const cwd =
            result.stdout.trim();


        if (
            cwd === "/home/user"
        ) {

            currentDirectory =
                "~";

        } else if (
            cwd.startsWith(
                "/home/user/"
            )
        ) {

            currentDirectory =
                "~" +
                cwd.substring(
                    "/home/user".length
                );

        } else {

            currentDirectory =
                cwd;
        }

    } catch {

        currentDirectory =
            "~";
    }
}


function writePrompt() {

    terminal.write(
        "\x1b[32muser@sandbox\x1b[0m:" +
        "\x1b[36m" +
        currentDirectory +
        "\x1b[0m$ "
    );
}


/* =========================================================
   OUTPUT
========================================================= */

function writeOutput(
    text
) {

    if (!text) {
        return;
    }


    text =
        String(text)
            .replace(
                /\r\n/g,
                "\n"
            )
            .replace(
                /\r/g,
                "\n"
            );


    const lines =
        text.split("\n");


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        if (
            lines[i].length
        ) {

            terminal.write(
                lines[i]
            );
        }


        if (
            i <
            lines.length - 1
        ) {

            terminal.write(
                "\r\n"
            );
        }
    }
}


function newLine() {

    terminal.write(
        "\r\n"
    );
}


/* =========================================================
   HELP
========================================================= */

function showHelp() {

    newLine();

    terminal.writeln(
        "\x1b[36mBrowser Linux Sandbox\x1b[0m"
    );

    terminal.writeln("");

    terminal.writeln(
        "  help       Show this help"
    );

    terminal.writeln(
        "  save       Files are saved automatically"
    );

    terminal.writeln(
        "  reset      Delete the persistent filesystem"
    );

    terminal.writeln(
        "  clear      Clear the terminal"
    );

    terminal.writeln("");

    terminal.writeln(
        "\x1b[90mThe filesystem is stored in this browser using OPFS.\x1b[0m"
    );

    terminal.writeln(
        "\x1b[90mIt is separate from the real computer filesystem.\x1b[0m"
    );

    terminal.writeln("");

    writePrompt();
}


/* =========================================================
   RESET
========================================================= */

async function resetSandbox() {

    newLine();

    terminal.writeln(
        "\x1b[33mDeleting browser sandbox...\x1b[0m"
    );


    const root =
        await getOPFSRoot();


    try {

        await root.removeEntry(
            OPFS_DIRECTORY,
            {
                recursive: true
            }
        );

    } catch (error) {

        if (
            error.name !==
            "NotFoundError"
        ) {

            throw error;
        }
    }


    terminal.writeln(
        "\x1b[32mSandbox deleted.\x1b[0m"
    );

    terminal.writeln(
        "\x1b[90mReload the page to create a new sandbox.\x1b[0m"
    );

    writePrompt();
}


/* =========================================================
   SPECIAL COMMANDS
========================================================= */

async function handleSpecialCommand(
    command
) {

    const trimmed =
        command.trim();


    if (
        trimmed === "help"
    ) {

        showHelp();

        return true;
    }


    if (
        trimmed === "clear"
    ) {

        terminal.clear();

        terminal.write(
            "\x1b[2J\x1b[H"
        );

        writePrompt();

        return true;
    }


    if (
        trimmed === "save"
    ) {

        newLine();

        terminal.writeln(
            "\x1b[32mFilesystem is continuously stored in browser OPFS.\x1b[0m"
        );

        writePrompt();

        return true;
    }


    if (
        trimmed === "reset"
    ) {

        newLine();

        terminal.writeln(
            "\x1b[33mThis deletes the saved browser filesystem.\x1b[0m"
        );

        terminal.writeln(
            "\x1b[33mType \"reset yes\" to confirm.\x1b[0m"
        );

        writePrompt();

        return true;
    }


    if (
        trimmed === "reset yes"
    ) {

        await resetSandbox();

        return true;
    }


    return false;
}


/* =========================================================
   EXECUTE COMMAND
========================================================= */

async function executeCommand(
    command
) {

    if (
        !bash ||
        commandRunning
    ) {

        return;
    }


    if (
        command.trim() === ""
    ) {

        newLine();

        writePrompt();

        return;
    }


    history.push(
        command
    );


    if (
        history.length > 100
    ) {

        history.shift();
    }


    historyIndex =
        -1;


    if (
        await handleSpecialCommand(
            command
        )
    ) {

        return;
    }


    commandRunning =
        true;


    try {

        /*
         * IMPORTANT:
         *
         * Because OPFS is asynchronous,
         * we use execute(), NOT executeSync().
         */

        const result =
            await bash.execute(
                command
            );


        newLine();


        if (
            result.stdout
        ) {

            writeOutput(
                result.stdout
            );
        }


        if (
            result.stderr
        ) {

            if (
                result.stdout &&
                !result.stdout.endsWith("\n")
            ) {

                newLine();
            }


            terminal.write(
                "\x1b[31m"
            );

            writeOutput(
                result.stderr
            );

            terminal.write(
                "\x1b[0m"
            );
        }


        /*
         * The current working directory
         * belongs to the Bash session, so
         * update the prompt after every command.
         */

        await updatePrompt();


        newLine();

        writePrompt();


    } catch (error) {

        newLine();


        terminal.write(
            "\x1b[31m"
        );


        terminal.write(
            error.message ||
            String(error)
        );


        terminal.write(
            "\x1b[0m"
        );


        newLine();

        writePrompt();

    } finally {

        commandRunning =
            false;
    }
}


/* =========================================================
   HISTORY
========================================================= */

function historyUp() {

    if (
        history.length === 0
    ) {

        return;
    }


    if (
        historyIndex === -1
    ) {

        historyIndex =
            history.length - 1;

    } else if (
        historyIndex > 0
    ) {

        historyIndex--;
    }


    replaceInput(
        history[
            historyIndex
        ]
    );
}


function historyDown() {

    if (
        historyIndex === -1
    ) {

        return;
    }


    if (
        historyIndex <
        history.length - 1
    ) {

        historyIndex++;


        replaceInput(
            history[
                historyIndex
            ]
        );

    } else {

        historyIndex =
            -1;


        replaceInput(
            ""
        );
    }
}


function replaceInput(
    text
) {

    while (
        inputBuffer.length > 0
    ) {

        inputBuffer =
            inputBuffer.slice(
                0,
                -1
            );


        terminal.write(
            "\b \b"
        );
    }


    inputBuffer =
        text;


    terminal.write(
        text
    );
}


/* =========================================================
   TERMINAL INPUT
========================================================= */

terminal.onData(
    async data => {

        if (!ready) {
            return;
        }


        /*
         * Do not accept another command
         * while the previous command is running.
         */

        if (
            commandRunning
        ) {

            return;
        }


        /*
         * ENTER
         */

        if (
            data === "\r"
        ) {

            const command =
                inputBuffer;


            inputBuffer =
                "";


            historyIndex =
                -1;


            await executeCommand(
                command
            );


            return;
        }


        /*
         * BACKSPACE
         */

        if (
            data === "\x7f"
        ) {

            if (
                inputBuffer.length > 0
            ) {

                inputBuffer =
                    inputBuffer.slice(
                        0,
                        -1
                    );


                terminal.write(
                    "\b \b"
                );
            }


            return;
        }


        /*
         * CTRL+C
         */

        if (
            data === "\x03"
        ) {

            terminal.write(
                "^C"
            );


            newLine();


            inputBuffer =
                "";


            historyIndex =
                -1;


            writePrompt();


            return;
        }


        /*
         * CTRL+L
         */

        if (
            data === "\x0c"
        ) {

            terminal.clear();


            terminal.write(
                "\x1b[2J\x1b[H"
            );


            writePrompt();


            return;
        }


        /*
         * UP
         */

        if (
            data === "\x1b[A"
        ) {

            historyUp();

            return;
        }


        /*
         * DOWN
         */

        if (
            data === "\x1b[B"
        ) {

            historyDown();

            return;
        }


        /*
         * Ignore other ANSI escape sequences.
         */

        if (
            data.startsWith("\x1b")
        ) {

            return;
        }


        /*
         * Printable characters.
         */

        for (
            const character
            of data
        ) {

            if (
                character.charCodeAt(0) < 32
            ) {

                continue;
            }


            inputBuffer +=
                character;


            terminal.write(
                character
            );
        }
    }
);


/* =========================================================
   START
========================================================= */

async function start() {

    terminal.write(
        "\x1b[90mStarting Browser Linux Sandbox...\x1b[0m\r\n"
    );


    try {

        /*
         * Initialize Bashkit WASM.
         */

        await initBashkit();


        /*
         * Prepare persistent browser storage.
         */

        await initializeStorage();


        /*
         * Create Bashkit with our
         * persistent OPFS filesystem.
         */

        bash =
            new Bash({
                username: "user",
                hostname: "sandbox",
                cwd: "/home/user",

                env: {
                    USER: "user",
                    HOME: "/home/user",
                    SHELL: "/bin/bash",
                    TERM: "xterm-256color"
                },

                fs: persistentFS
            });


        /*
         * Ensure the home directory exists.
         */

        await bash.execute(
            "mkdir -p /home/user && cd /home/user"
        );


        /*
         * Check whether files survived
         * a previous page load.
         */

        const test =
            await bash.execute(
                "ls -la /home/user"
            );


        /*
         * Make /dev/null available.
         * The host filesystem handles it
         * specially without storing it.
         */

        ready =
            true;


        await updatePrompt();


        terminal.write(
            "\x1b[32mBashkit WASM initialized.\x1b[0m\r\n"
        );


        terminal.write(
            "\x1b[32mPersistent browser filesystem enabled.\x1b[0m\r\n"
        );


        terminal.write(
            "\x1b[90mFiles survive page refreshes in this browser.\x1b[0m\r\n"
        );


        terminal.write(
            "\x1b[90mType \"help\" to get started.\x1b[0m\r\n\r\n"
        );


        /*
         * Show any existing files if there
         * are some from an earlier session.
         */

        if (
            test.stdout &&
            test.stdout.trim()
        ) {

            /*
             * Don't print the default "." and ".."
             * style noise; just tell the user the
             * filesystem was restored.
             */

            const listing =
                test.stdout
                    .split("\n")
                    .filter(
                        line =>
                            line.trim() &&
                            !line.includes(
                                "total 0"
                            )
                    );


            if (
                listing.length > 0
            ) {

                terminal.write(
                    "\x1b[90mExisting sandbox files restored.\x1b[0m\r\n\r\n"
                );
            }
        }


        writePrompt();


        terminal.focus();


    } catch (error) {

        ready =
            false;


        terminal.write(
            "\r\n\x1b[31mBashkit initialization failed.\x1b[0m\r\n"
        );


        terminal.write(
            "\x1b[31m" +
            (
                error.message ||
                String(error)
            ) +
            "\x1b[0m\r\n"
        );


        console.error(
            "Bashkit initialization error:",
            error
        );
    }
}


/* =========================================================
   RUN
========================================================= */

start();

</script>

</body>
</html>
