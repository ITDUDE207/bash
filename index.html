
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Linux Sandbox</title>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.4.0/css/xterm.css"
>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#terminal {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="terminal"></div>

<script type="module">

/* =========================================
   IMPORTS
========================================= */

import {
    Terminal
} from "https://esm.sh/@xterm/xterm@5.4.0";

import {
    FitAddon
} from "https://esm.sh/@xterm/addon-fit@0.9.0";

import {
    initBashkit,
    Bash
} from "https://esm.sh/@everruns/bashkit-wasm@0.18.0";


/* =========================================
   TERMINAL
========================================= */

const terminalElement =
    document.getElementById("terminal");

const term =
    new Terminal({
        cursorBlink: true,
        cursorStyle: "block",
        fontFamily:
            'Consolas, "Courier New", monospace',
        fontSize: 15,
        lineHeight: 1.2,
        scrollback: 10000,
        convertEol: true,

        theme: {
            background: "#000000",
            foreground: "#f0f0f0",
            cursor: "#ffffff",

            black: "#000000",
            red: "#ff5555",
            green: "#50fa7b",
            yellow: "#f1fa8c",
            blue: "#6272a4",
            magenta: "#ff79c6",
            cyan: "#8be9fd",
            white: "#bbbbbb",

            brightBlack: "#555555",
            brightRed: "#ff6e6e",
            brightGreen: "#69ff94",
            brightYellow: "#ffffa5",
            brightBlue: "#7d8cff",
            brightMagenta: "#ff92df",
            brightCyan: "#a4ffff",
            brightWhite: "#ffffff"
        }
    });

const fitAddon =
    new FitAddon();

term.loadAddon(fitAddon);

term.open(terminalElement);

fitAddon.fit();

window.addEventListener(
    "resize",
    () => fitAddon.fit()
);


/* =========================================
   BASH
========================================= */

let bash = null;

let ready = false;

let inputBuffer = "";

let history = [];

let historyIndex = -1;

let currentDirectory = "~";


/* =========================================
   INDEXEDDB
========================================= */

const DB_NAME =
    "BrowserLinuxSandbox";

const DB_VERSION =
    1;

const STORE_NAME =
    "sandbox";

const SNAPSHOT_KEY =
    "bashkit-snapshot";


function openDatabase() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );

            request.onupgradeneeded =
                event => {

                    const db =
                        event.target.result;

                    if (
                        !db.objectStoreNames.contains(
                            STORE_NAME
                        )
                    ) {

                        db.createObjectStore(
                            STORE_NAME
                        );
                    }
                };

            request.onsuccess =
                () => resolve(
                    request.result
                );

            request.onerror =
                () => reject(
                    request.error
                );
        }
    );
}


/* =========================================
   SAVE SANDBOX
========================================= */

async function saveSandbox() {

    if (!bash) {
        return false;
    }

    try {

        /*
         * Bashkit 0.18.0 exposes snapshot()
         * as a Uint8Array.
         */

        const snapshot =
            bash.snapshot();


        const db =
            await openDatabase();


        await new Promise(
            (resolve, reject) => {

                const transaction =
                    db.transaction(
                        STORE_NAME,
                        "readwrite"
                    );

                const store =
                    transaction.objectStore(
                        STORE_NAME
                    );


                /*
                 * Store the Uint8Array directly.
                 */

                store.put(
                    snapshot,
                    SNAPSHOT_KEY
                );


                transaction.oncomplete =
                    () => resolve();


                transaction.onerror =
                    () => reject(
                        transaction.error
                    );
            }
        );


        db.close();

        return true;

    } catch (error) {

        console.error(
            "Save failed:",
            error
        );

        return false;
    }
}


/* =========================================
   LOAD SANDBOX
========================================= */

async function loadSandbox() {

    try {

        const db =
            await openDatabase();


        const snapshot =
            await new Promise(
                (resolve, reject) => {

                    const transaction =
                        db.transaction(
                            STORE_NAME,
                            "readonly"
                        );

                    const store =
                        transaction.objectStore(
                            STORE_NAME
                        );


                    const request =
                        store.get(
                            SNAPSHOT_KEY
                        );


                    request.onsuccess =
                        () => resolve(
                            request.result
                        );


                    request.onerror =
                        () => reject(
                            request.error
                        );
                }
            );


        db.close();


        if (!snapshot) {
            return false;
        }


        /*
         * Restore the complete shell state
         * and virtual filesystem.
         */

        bash.restoreSnapshot(
            snapshot
        );


        return true;

    } catch (error) {

        console.error(
            "Restore failed:",
            error
        );

        return false;
    }
}


/* =========================================
   DELETE SANDBOX
========================================= */

async function deleteSandbox() {

    try {

        const db =
            await openDatabase();


        await new Promise(
            (resolve, reject) => {

                const transaction =
                    db.transaction(
                        STORE_NAME,
                        "readwrite"
                    );

                const store =
                    transaction.objectStore(
                        STORE_NAME
                    );


                store.delete(
                    SNAPSHOT_KEY
                );


                transaction.oncomplete =
                    () => resolve();


                transaction.onerror =
                    () => reject(
                        transaction.error
                    );
            }
        );


        db.close();

        return true;

    } catch (error) {

        console.error(
            "Delete failed:",
            error
        );

        return false;
    }
}


/* =========================================
   PROMPT
========================================= */

function updatePrompt() {

    if (!bash) {
        return;
    }


    try {

        const result =
            bash.executeSync(
                "pwd"
            );


        const cwd =
            result.stdout.trim();


        if (
            cwd === "/home/user"
        ) {

            currentDirectory =
                "~";

        } else if (
            cwd.startsWith(
                "/home/user/"
            )
        ) {

            currentDirectory =
                "~" +
                cwd.substring(
                    "/home/user".length
                );

        } else {

            currentDirectory =
                cwd;
        }

    } catch {

        currentDirectory =
            "~";
    }
}


function writePrompt() {

    term.write(
        "\x1b[32muser@sandbox\x1b[0m:" +
        "\x1b[36m" +
        currentDirectory +
        "\x1b[0m$ "
    );
}


/* =========================================
   OUTPUT
========================================= */

function writeOutput(text) {

    if (!text) {
        return;
    }


    text =
        text.replace(
            /\r\n/g,
            "\n"
        );


    text =
        text.replace(
            /\r/g,
            "\n"
        );


    const lines =
        text.split("\n");


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        if (
            lines[i].length > 0
        ) {

            term.write(
                lines[i]
            );
        }


        if (
            i < lines.length - 1
        ) {

            term.write(
                "\r\n"
            );
        }
    }
}


/* =========================================
   NEW LINE
========================================= */

function newLine() {

    term.write(
        "\r\n"
    );
}


/* =========================================
   INITIALIZE
========================================= */

async function start() {

    term.write(
        "\x1b[90mStarting Browser Linux Sandbox...\x1b[0m\r\n"
    );


    try {

        await initBashkit();


        bash =
            new Bash({
                username: "user",
                hostname: "sandbox",
                cwd: "/home/user",

                env: {
                    USER: "user",
                    HOME: "/home/user",
                    SHELL: "/bin/bash"
                }
            });


        /*
         * Check that the loaded Bashkit
         * actually supports persistence.
         */

        if (
            typeof bash.snapshot !== "function"
        ) {

            throw new Error(
                "This Bashkit build does not expose snapshot(). Loaded version: 0.18.0"
            );
        }


        if (
            typeof bash.restoreSnapshot !== "function"
        ) {

            throw new Error(
                "This Bashkit build does not expose restoreSnapshot()."
            );
        }


        /*
         * Try restoring saved browser state.
         */

        const restored =
            await loadSandbox();


        if (restored) {

            term.write(
                "\x1b[32mSandbox restored from browser storage.\x1b[0m\r\n"
            );

        } else {

            /*
             * Create the initial home directory.
             */

            bash.executeSync(
                "mkdir -p /home/user"
            );

            bash.executeSync(
                "cd /home/user"
            );


            await saveSandbox();


            term.write(
                "\x1b[32mNew sandbox created.\x1b[0m\r\n"
            );
        }


        updatePrompt();


        ready = true;


        term.write(
            "\x1b[90mFiles are automatically saved in this browser.\x1b[0m\r\n"
        );


        term.write(
            "\x1b[90mType \"help\" for commands.\x1b[0m\r\n\r\n"
        );


        writePrompt();

        term.focus();


    } catch (error) {

        term.write(
            "\r\n\x1b[31mBashkit initialization failed.\x1b[0m\r\n"
        );


        term.write(
            "\x1b[31m" +
            error.name +
            ": " +
            error.message +
            "\x1b[0m\r\n"
        );


        console.error(
            "Bashkit initialization error:",
            error
        );
    }
}


/* =========================================
   SPECIAL COMMANDS
========================================= */

async function specialCommand(command) {

    const trimmed =
        command.trim();


    /* HELP */

    if (
        trimmed === "help"
    ) {

        newLine();

        term.writeln(
            "\x1b[36mBrowser Linux Sandbox\x1b[0m"
        );

        term.writeln(
            ""
        );

        term.writeln(
            "  help       Show this help"
        );

        term.writeln(
            "  save       Save sandbox now"
        );

        term.writeln(
            "  reset      Delete saved sandbox"
        );

        term.writeln(
            "  clear      Clear terminal"
        );

        term.writeln(
            ""
        );

        writePrompt();

        return true;
    }


    /* SAVE */

    if (
        trimmed === "save"
    ) {

        newLine();

        const saved =
            await saveSandbox();


        if (saved) {

            term.writeln(
                "\x1b[32mSandbox saved to this browser.\x1b[0m"
            );

        } else {

            term.writeln(
                "\x1b[31mSandbox could not be saved.\x1b[0m"
            );
        }


        writePrompt();

        return true;
    }


    /* RESET */

    if (
        trimmed === "reset"
    ) {

        newLine();

        term.writeln(
            "\x1b[33mThis will delete the saved browser sandbox.\x1b[0m"
        );

        term.writeln(
            "\x1b[33mType \"reset yes\" to confirm.\x1b[0m"
        );

        writePrompt();

        return true;
    }


    /* RESET YES */

    if (
        trimmed === "reset yes"
    ) {

        newLine();

        await deleteSandbox();


        term.writeln(
            "\x1b[32mSaved sandbox deleted.\x1b[0m"
        );

        term.writeln(
            "\x1b[90mReload the page to create a fresh sandbox.\x1b[0m"
        );


        writePrompt();

        return true;
    }


    /* CLEAR */

    if (
        trimmed === "clear"
    ) {

        term.clear();

        term.write(
            "\x1b[2J\x1b[H"
        );

        writePrompt();

        return true;
    }


    return false;
}


/* =========================================
   EXECUTE
========================================= */

async function executeCommand(command) {

    if (!bash) {
        return;
    }


    /*
     * Empty command.
     */

    if (
        command.trim() === ""
    ) {

        newLine();

        writePrompt();

        return;
    }


    /*
     * History.
     */

    history.push(
        command
    );


    if (
        history.length > 100
    ) {

        history.shift();
    }


    historyIndex = -1;


    /*
     * Built-in browser commands.
     */

    if (
        await specialCommand(
            command
        )
    ) {

        return;
    }


    try {

        const result =
            bash.executeSync(
                command
            );


        /*
         * Finish the typed command line.
         */

        newLine();


        /*
         * STDOUT.
         */

        if (
            result.stdout
        ) {

            writeOutput(
                result.stdout
            );
        }


        /*
         * STDERR.
         */

        if (
            result.stderr
        ) {

            if (
                result.stdout &&
                !result.stdout.endsWith("\n")
            ) {

                newLine();
            }


            term.write(
                "\x1b[31m"
            );


            writeOutput(
                result.stderr
            );


            term.write(
                "\x1b[0m"
            );
        }


        /*
         * Always put the next prompt
         * on its own line.
         */

        newLine();


        updatePrompt();


        /*
         * Persist everything:
         *
         * - files
         * - directories
         * - environment
         * - variables
         * - aliases
         * - current directory
         */

        await saveSandbox();


        writePrompt();


    } catch (error) {

        newLine();


        term.write(
            "\x1b[31m" +
            error.message +
            "\x1b[0m"
        );


        newLine();

        writePrompt();
    }
}


/* =========================================
   INPUT
========================================= */

term.onData(
    async data => {

        if (!ready) {
            return;
        }


        /*
         * ENTER
         */

        if (
            data === "\r"
        ) {

            const command =
                inputBuffer;


            inputBuffer =
                "";


            historyIndex =
                -1;


            await executeCommand(
                command
            );


            return;
        }


        /*
         * BACKSPACE
         */

        if (
            data === "\x7f"
        ) {

            if (
                inputBuffer.length > 0
            ) {

                inputBuffer =
                    inputBuffer.slice(
                        0,
                        -1
                    );


                term.write(
                    "\b \b"
                );
            }


            return;
        }


        /*
         * CTRL+C
         */

        if (
            data === "\x03"
        ) {

            term.write(
                "^C"
            );


            newLine();


            inputBuffer =
                "";


            historyIndex =
                -1;


            writePrompt();


            return;
        }


        /*
         * CTRL+L
         */

        if (
            data === "\x0c"
        ) {

            term.clear();


            term.write(
                "\x1b[2J\x1b[H"
            );


            writePrompt();


            return;
        }


        /*
         * UP
         */

        if (
            data === "\x1b[A"
        ) {

            historyUp();

            return;
        }


        /*
         * DOWN
         */

        if (
            data === "\x1b[B"
        ) {

            historyDown();

            return;
        }


        /*
         * Ignore other escape sequences.
         */

        if (
            data.startsWith("\x1b")
        ) {

            return;
        }


        /*
         * Printable characters.
         */

        for (
            const character of data
        ) {

            if (
                character.charCodeAt(0) < 32
            ) {

                continue;
            }


            inputBuffer +=
                character;


            term.write(
                character
            );
        }
    }
);


/* =========================================
   HISTORY UP
========================================= */

function historyUp() {

    if (
        history.length === 0
    ) {

        return;
    }


    if (
        historyIndex === -1
    ) {

        historyIndex =
            history.length - 1;

    } else if (
        historyIndex > 0
    ) {

        historyIndex--;
    }


    replaceInput(
        history[
            historyIndex
        ]
    );
}


/* =========================================
   HISTORY DOWN
========================================= */

function historyDown() {

    if (
        historyIndex === -1
    ) {

        return;
    }


    if (
        historyIndex <
        history.length - 1
    ) {

        historyIndex++;


        replaceInput(
            history[
                historyIndex
            ]
        );

    } else {

        historyIndex =
            -1;


        replaceInput(
            ""
        );
    }
}


/* =========================================
   REPLACE INPUT
========================================= */

function replaceInput(text) {

    while (
        inputBuffer.length > 0
    ) {

        inputBuffer =
            inputBuffer.slice(
                0,
                -1
            );


        term.write(
            "\b \b"
        );
    }


    inputBuffer =
        text;


    term.write(
        text
    );
}


/* =========================================
   START
========================================= */

start();

</script>

</body>
</html>
